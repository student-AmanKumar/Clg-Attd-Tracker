<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>College Attendance App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    
    <h1>🎓 College Attendance Tracker</h1>
    <div class="theme-toggle">
  <label class="switch">
    <input type="checkbox" id="darkToggle" onchange="toggleDarkMode()" />
    <span class="slider"></span>
  </label>
  <span id="modeLabel">🌞 Light Mode</span>
</div>
  </header>

  <main>
    <div class="student-form">
      <input type="text" id="studentName" placeholder="Enter Student Name" />
      <input type="text" id="rollNumber" placeholder="Enter Roll Number" />
      <button onclick="addStudent()">Add Student</button>
    </div>
<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Search by name or roll number..." oninput="filterStudents()" />
</div>
    <div class="student-list" id="studentList"></div>

    <div class="summary" id="summary">
      <p>✅ Present: <span id="presentCount">0</span></p>
      <p>❌ Absent: <span id="absentCount">0</span></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
